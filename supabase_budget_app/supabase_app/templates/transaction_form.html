{% extends "base.html" %}
{% block title %}{{ action }} 거래 — 예산·구매 도우미{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ action }} 거래</h2>
    <form method="post">
        <div class="form-group">
            <label for="description">설명 *</label>
            <input type="text" id="description" name="description" value="{{ transaction.description }}" required placeholder="예: 과학 교과서 3권">
        </div>
        <div class="row">
            <div class="form-group">
                <label for="amount">금액 (원) *</label>
                <input type="number" id="amount" name="amount" value="{{ transaction.amount }}" required min="0" step="100">
            </div>
            <div class="form-group">
                <label for="quantity">수량</label>
                <input type="number" id="quantity" name="quantity" min="1" value="{{ transaction.quantity }}">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label for="unit_price">단가</label>
                <input type="number" id="unit_price" name="unit_price" min="0" step="100" value="{{ transaction.unit_price }}">
            </div>
            <div class="form-group">
                <label for="category">분류</label>
                <input type="text" id="category" name="category" value="{{ transaction.category }}">
            </div>
        </div>
        <div class="form-group">
            <label for="notes">메모</label>
            <textarea id="notes" name="notes" rows="2">{{ transaction.notes }}</textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{{ url_for('app.ledger') }}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
{% endblock %}
