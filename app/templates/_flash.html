{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="padding:10px 14px; margin-bottom:10px; border-radius:6px; background:{{ '#fee2e2' if category == 'error' else '#dcfce7' }};">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
