<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>수기 입력</title>
    <style>
        :root {
            --bg: #f5f7fb; --card: #ffffff; --border: #e2e8f0; --text: #1f2937;
            --muted: #64748b; --accent: #2563eb; --accent-bg: #eef2ff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
        .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
        .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .nav a { background: var(--card); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 14px; }
        .nav a:hover { background: var(--accent-bg); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
        .form-row input, .form-row select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff;
        }
        .form-row input[type="number"] { max-width: 150px; }
        .form-row input[type="date"] { max-width: 170px; }
        .form-section { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fafbfc; }
        .hint { color: var(--muted); font-size: 12px; }
        .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; text-decoration: none; color: var(--text); }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-add { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
        .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }
    </style>
</head>
<body>
    <div class="wrap">
        {% include '_nav.html' %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card">
            <h1>수기 입력</h1>
            <p class="hint"> 이미지 없이 거래만 입력하거나, 인식 결과를 보완할 때 사용합니다.</p>

            <form method="post">
                <div class="form-row">
                    <label for="budget_id">예산 선택</label>
                    <select id="budget_id" name="budget_id">
                        {% for b in budgets %}
                            <option value="{{ b.budget_id }}">{{ b.budget_name }} ({{ b.year }}년, {{ b.type }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-row">
                    <label for="merchant_name">거래처</label>
                    <input type="text" id="merchant_name" name="merchant_name" placeholder="예: 문구점, 온라인몰" required>
                </div>

                <div class="form-row">
                    <label for="transaction_date">사용일</label>
                    <input type="date" id="transaction_date" name="transaction_date">
                    <div class="hint">모르면 비워 두고 확인 단계에서 표시합니다.</div>
                </div>

                <div class="form-row">
                    <label for="total_amount">총액</label>
                    <input type="number" id="total_amount" name="total_amount" step="0.01" value="0" required>
                </div>

                <div class="form-section">
                    <h2>품목</h2>
                    <div id="items">
                        <div class="item-row" style="margin-bottom:10px;">
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <input type="text" name="item_name" placeholder="품목명" style="flex:1; min-width:140px;">
                                <input type="text" name="item_specification" placeholder="규격/옵션" style="flex:1; min-width:120px;">
                                <input type="number" name="item_quantity" step="0.01" value="1" style="max-width:90px;">
                                <input type="text" name="item_unit" value="개" style="max-width:90px;">
                                <input type="number" name="item_unit_price" step="0.01" value="0" style="max-width:110px;">
                                <input type="number" name="item_amount" step="0.01" value="0" style="max-width:110px;">
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-add" onclick="addItemRow()">품목 추가</button>
                </div>

                <button type="submit" class="btn btn-primary">저장</button>
            </form>
        </div>
    </div>

    <script>
        function addItemRow() {
            const container = document.getElementById('items');
            const div = document.createElement('div');
            div.className = 'item-row';
            div.style.marginBottom = '10px';
            div.innerHTML = `
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <input type="text" name="item_name" placeholder="품목명" style="flex:1; min-width:140px;">
                    <input type="text" name="item_specification" placeholder="규격/옵션" style="flex:1; min-width:120px;">
                    <input type="number" name="item_quantity" step="0.01" value="1" style="max-width:90px;">
                    <input type="text" name="item_unit" value="개" style="max-width:90px;">
                    <input type="number" name="item_unit_price" step="0.01" value="0" style="max-width:110px;">
                    <input type="number" name="item_amount" step="0.01" value="0" style="max-width:110px;">
                </div>
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
